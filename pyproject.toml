[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-revenue-cx-intelligence"
version = "1.0.0"
description = "Reproducible Olist sales, operations and customer experience analytics"
requires-python = ">=3.11"
dependencies = ["pandas==2.3.3", "duckdb==1.4.1", "matplotlib==3.10.7", "scipy==1.16.3", "requests==2.32.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.test-tmp"

[tool.setuptools.packages.find]
include = ["src*"]
